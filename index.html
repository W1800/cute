<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرحباً</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1d3a;
    font-family: sans-serif;
  }
  button {
    padding: 16px 40px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    background: #fff;
    color: #0b1d3a;
    cursor: pointer;
  }
</style>
</head>
<body>
  <button id="btn">اضغط للدخول 🎵</button>
  <audio id="music" src="music.mp3" loop></audio>

  <script>
    const btn = document.getElementById('btn');
    const music = document.getElementById('music');
    btn.addEventListener('click', () => {
      music.play();
      btn.textContent = 'شغّال 🎶';
    });
  </script>
</body>
</html>

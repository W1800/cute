<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرحباً</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1d3a;
    color: #fff;
    font-family: sans-serif;
    font-size: 22px;
  }
</style>
</head>
<body>
  <p id="msg">🎵</p>
  <audio id="music" src="VYRO-1790815788246.mp3" loop autoplay></audio>

  <script>
    const music = document.getElementById('music');

    function start() {
      music.play().then(() => {
        ['click','touchstart','keydown','scroll','mousemove']
          .forEach(e => document.removeEventListener(e, start));
      }).catch(() => {});
    }

    // محاولة تشغيل مباشرة
    start();

    // لو انمنعت، تشتغل مع أول تفاعل
    ['click','touchstart','keydown','scroll','mousemove']
      .forEach(e => document.addEventListener(e, start));
  </script>
</body>
</html>
